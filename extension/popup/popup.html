<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishShield AI Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Ambient Glass Mesh Glow Orbs -->
  <div class="glass-mesh-bg" aria-hidden="true">
    <div class="mesh-orb orb-indigo"></div>
    <div class="mesh-orb orb-cyan"></div>
    <div class="mesh-orb orb-rose"></div>
  </div>

  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-badge">
          <svg class="logo-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="logo-titles">
          <h1 class="logo-title">PhishShield <span class="accent">AI</span></h1>
          <p class="logo-subtitle" id="logo-subtitle">Real-Time Threat Guardian</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-toggle-lang" class="btn-lang-toggle" title="Switch Language / ቋንቋ ቀይር">
          አማርኛ
        </button>
        <div class="toggle-container">
          <label class="switch" title="Toggle Real-Time Protection">
            <input type="checkbox" id="toggle-protection" checked>
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </header>

    <!-- Tab Security Status Glass Card -->
    <div id="status-card" class="status-card safe">
      <div class="status-icon-wrapper" id="status-icon">
        <svg class="status-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="status-details">
        <div class="status-title-row">
          <h2 class="status-title" id="status-title">Current Tab is Safe</h2>
          <span class="status-badge-tag" id="status-badge-tag">SAFE</span>
        </div>
        <p class="status-subtitle" id="status-subtitle">No phishing links, homographs, or credential harvesting detected.</p>
      </div>
    </div>

    <!-- "Why was this flagged?" Card -->
    <div id="why-flagged-card" class="why-flagged-card">
      <div class="why-flagged-header" id="why-flagged-header">
        <div class="why-flagged-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span id="why-flagged-label">Why was this flagged?</span>
        </div>
        <button id="btn-trust-domain" class="btn-trust-pill" title="Trust Current Domain">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span id="trust-btn-label">Trust Site</span>
        </button>
      </div>
      <ul id="why-flagged-list" class="why-reasons-list">
        <!-- Injected via JavaScript -->
      </ul>
    </div>

    <!-- Quick Stats Grid (Sites Checked & Threats Blocked) -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-top">
          <span class="stat-value" id="stat-sites-checked">0</span>
          <span class="stat-icon-hint">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
          </span>
        </div>
        <span class="stat-label" id="label-sites-checked">Sites Checked</span>
      </div>

      <div class="stat-box">
        <div class="stat-top">
          <span class="stat-value" id="stat-threats-blocked">0</span>
          <button id="btn-reset-stats" class="btn-reset-icon" title="Reset Counter" aria-label="Reset Counter">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
          </button>
        </div>
        <span class="stat-label" id="label-threats-blocked">Threats Blocked</span>
      </div>
    </div>

    <!-- History Accordion / Toggle -->
    <div class="history-section">
      <button id="btn-toggle-history" class="btn-history-toggle">
        <span id="label-scan-history">Recent Scan Activity</span>
        <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div id="history-drawer" class="history-drawer collapsed">
        <ul id="history-list" class="history-items">
          <!-- Injected via JavaScript -->
        </ul>
      </div>
    </div>

    <!-- Threat Dashboard Action -->
    <div class="dashboard-action-card">
      <button id="btn-open-dashboard" class="btn-dashboard" title="Open Threat Detection Dashboard">
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span id="label-open-dashboard">Open Threat Dashboard</span>
      </button>
    </div>

    <!-- Backend Status & Engine Mode -->
    <div class="backend-status-card">
      <div class="backend-indicator">
        <span class="dot" id="backend-dot"></span>
        <span class="backend-text" id="backend-text">Checking ML engine...</span>
      </div>
      <a id="link-test-lab" href="../test_lab.html" target="_blank" class="test-lab-link" title="Open Malicious Link Test Lab">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 2v7.31L4.65 17.6A2 2 0 0 0 6.35 21h11.3a2 2 0 0 0 1.7-3.4L14 9.31V2"/>
          <line x1="8.5" y1="2" x2="15.5" y2="2"/>
          <path d="M8.5 14h7"/>
        </svg>
        <span id="label-test-lab">Test Lab</span>
      </a>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>PhishShield AI • Multi-Vector Defense</span>
    </footer>
  </div>

  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
